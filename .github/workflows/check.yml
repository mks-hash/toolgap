name: Source and evidence checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_evidence.py
      - run: python scripts/check_tool_loop_evidence.py
      - run: python -m pip install -e .
      - run: bash scripts/test_client.sh
      - run: python examples/admission/local_check.py
      - run: bash scripts/install.sh
      - run: python -m compileall -q scripts benchmark src examples/tool_loop tests vendor/sglang/python/sglang/srt/mem_cache/proactive_prefetch.py
      - run: for script in scripts/*.sh examples/*.sh repro/*.sh; do bash -n "$script"; done
