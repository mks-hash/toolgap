[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "toolgap"
version = "0.2.0.dev0"
description = "Experimental exact-prefix KV prefetch client for SGLang"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28,<0.29"]
license = "Apache-2.0"

[tool.setuptools.packages.find]
where = ["src"]
